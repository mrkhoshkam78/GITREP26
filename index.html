<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="جستجوی هوشمند">
  <title>جستجوی هوشمند</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== HOME (Immersive) ========== -->
  <div id="homeView" class="home-view">
    <div class="logo-wrap">
      <img src="assets/logo.svg" alt="لوگو" width="92" height="92">
      <h1>جستجوی هوشمند</h1>
      <p class="version">نسخه ۸.۰</p>
    </div>
    <div class="search-box-home">
      <input type="text" id="homeInput" placeholder="جستجو کنید..." autocomplete="off" autofocus>
      <button id="homeSearchBtn" type="button">جستجو</button>
    </div>
  </div>

  <!-- ========== RESULTS (Search-engine style) ========== -->
  <div id="resultsView" class="results-view">
    <header class="topbar">
      <img src="assets/logo.svg" alt="لوگو" class="logo-mini" id="logoHome" title="بازگشت">
      <div class="search-inline">
        <input type="text" id="resultsInput" placeholder="جستجو کنید..." autocomplete="off">
        <button id="resultsSearchBtn" type="button">جستجو</button>
      </div>
      <span class="meta" id="resultMeta"></span>
    </header>

    <main class="results-main">
      <div class="filters-bar">
        <button class="chip active" data-source="all">همه</button>
        <button class="chip" data-source="web">وب</button>
        <button class="chip" data-source="wiki">ویکی‌پدیا و دانشنامه</button>
        <button class="chip" data-limit="3">۳ نتیجه</button>
        <button class="chip" data-limit="5">۵</button>
        <button class="chip" data-limit="10">۱۰</button>
      </div>

      <div id="loadingState" class="loading-box hidden">
        <div class="loader"></div>
        <p>در حال جستجو...</p>
      </div>

      <div id="resultsList"></div>

      <div id="emptyState" class="empty-box hidden">
        <p>نتیجه‌ای یافت نشد</p>
      </div>

      <div id="errorState" class="error-box hidden">
        <p id="errorMessage">خطایی رخ داد</p>
        <button id="retryBtn" class="chip" style="margin-top:1rem">تلاش مجدد</button>
      </div>
    </main>
  </div>

  <script src="js/smart-engine.js"></script>
  <script src="js/search-engines.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
