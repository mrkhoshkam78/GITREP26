<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10120f" />
  <title>Atelier — Prompt Engineering Studio</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23b5522a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='white' font-family='Georgia'%3EA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">A</div>
        <div>
          <h1>Atelier</h1>
          <p data-i18n="brandSub">Prompt Engineering Studio</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="stat-pill"><span data-i18n="savedCount">Saved prompts</span><strong id="statCount">0</strong></div>
        <div class="stat-pill"><span data-i18n="offlineBadge">Storage</span><strong data-i18n="offlineValue">IndexedDB · offline</strong></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <p class="kicker" id="kicker">Studio</p>
          <h2 id="pageTitle">Prompt Builder</h2>
          <p class="sub" id="pageSub"></p>
        </div>
        <div class="tools">
          <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">◐</button>
          <select id="uiLang" aria-label="Interface language">
            <option value="en">English</option>
            <option value="fa">فارسی</option>
          </select>
        </div>
      </header>
      <div id="view"></div>
      <p class="footer-note" data-i18n="footer">Fully offline. Nothing leaves this browser.</p>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
