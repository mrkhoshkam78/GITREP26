<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity=".35"/>
    </filter>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <!-- soft blobs -->
  <ellipse cx="650" cy="120" rx="160" ry="140" fill="url(#a)" opacity=".25"/>
  <ellipse cx="120" cy="480" rx="130" ry="110" fill="url(#b)" opacity=".22"/>
  <ellipse cx="480" cy="520" rx="100" ry="80" fill="url(#c)" opacity=".18"/>
  <!-- main browser window -->
  <g filter="url(#s)">
    <rect x="180" y="80" width="440" height="320" rx="24" fill="url(#card)"/>
    <rect x="180" y="80" width="440" height="48" rx="24" fill="#312e81"/>
    <rect x="180" y="104" width="440" height="24" fill="#312e81"/>
    <circle cx="208" cy="104" r="6" fill="#f87171"/>
    <circle cx="228" cy="104" r="6" fill="#fbbf24"/>
    <circle cx="248" cy="104" r="6" fill="#34d399"/>
    <rect x="280" y="94" width="240" height="20" rx="10" fill="#1e293b"/>
    <circle cx="295" cy="104" r="5" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <!-- search results lines -->
    <rect x="210" y="150" width="180" height="14" rx="7" fill="#818cf8" opacity=".9"/>
    <rect x="210" y="174" width="280" height="8" rx="4" fill="#475569"/>
    <rect x="210" y="190" width="240" height="8" rx="4" fill="#334155"/>
    <rect x="210" y="220" width="160" height="14" rx="7" fill="#22d3ee" opacity=".85"/>
    <rect x="210" y="244" width="300" height="8" rx="4" fill="#475569"/>
    <rect x="210" y="260" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="210" y="290" width="140" height="14" rx="7" fill="#f472b6" opacity=".85"/>
    <rect x="210" y="314" width="260" height="8" rx="4" fill="#475569"/>
    <rect x="210" y="330" width="200" height="8" rx="4" fill="#334155"/>
  </g>
  <!-- floating card left -->
  <g filter="url(#s2)">
    <rect x="40" y="200" width="160" height="100" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="70" cy="235" r="16" fill="url(#b)"/>
    <rect x="96" y="225" width="80" height="10" rx="5" fill="#64748b"/>
    <rect x="96" y="243" width="60" height="8" rx="4" fill="#334155"/>
    <rect x="56" y="270" width="48" height="16" rx="8" fill="#6366f1"/>
  </g>
  <!-- floating card right -->
  <g filter="url(#s2)">
    <rect x="600" y="240" width="150" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="620" y="260" width="70" height="10" rx="5" fill="#a78bfa"/>
    <rect x="620" y="280" width="110" height="8" rx="4" fill="#475569"/>
    <rect x="620" y="296" width="90" height="8" rx="4" fill="#334155"/>
  </g>
  <!-- magnifier accent -->
  <circle cx="520" cy="420" r="36" stroke="url(#a)" stroke-width="8" fill="none" opacity=".9"/>
  <path d="M546 446l28 28" stroke="url(#c)" stroke-width="8" stroke-linecap="round"/>
  <!-- connection dots -->
  <circle cx="100" cy="120" r="5" fill="#22d3ee"/>
  <circle cx="700" cy="180" r="4" fill="#fbbf24"/>
  <circle cx="150" cy="450" r="6" fill="#ec4899"/>
  <path d="M100 120L200 140M700 180L600 160M150 450L220 360" stroke="#64748b" stroke-width="1.5" opacity=".35" stroke-dasharray="4 4"/>
</svg>
